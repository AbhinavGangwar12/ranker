<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Leaderboard</title>

    <!-- External Scripts and Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        cream: { 50: '#faf3ea', 100: '#f3e9db', 200: '#e8dcc8' },
                        ink: { 900: '#2b2f3a', 700: '#4a3f35', 500: '#8a7a63', 400: '#a89a83' },
                        teal: { 600: '#2f7d6b', 500: '#3a9484' },
                        terracotta: { 500: '#b5652f', 100: '#f3ded0' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex h-screen overflow-hidden antialiased selection:bg-teal-500 selection:text-white bg-cream-50 text-ink-900">

    <!-- Sidebar Navigation -->
    <aside class="w-20 lg:w-64 flex-shrink-0 border-r border-cream-200 bg-cream-100 flex flex-col transition-all duration-300 z-20">
        <div class="h-16 flex items-center justify-center lg:justify-start lg:px-6 border-b border-cream-200">
            <div class="w-8 h-8 rounded-lg bg-teal-600 flex items-center justify-center flex-shrink-0">
                <i class="fa-solid fa-bolt text-white text-sm"></i>
            </div>
            <span class="ml-3 font-semibold text-lg hidden lg:block tracking-wide text-ink-700">AI<span class="text-teal-600">Board</span></span>
        </div>

        <div class="flex-1 py-6 flex flex-col gap-1 px-3 overflow-y-auto">
            <div class="text-xs font-semibold text-ink-400 uppercase tracking-wider mb-2 hidden lg:block px-3">Categories</div>
            <button class="nav-btn active flex items-center gap-3 px-3 py-3 rounded-xl bg-white text-teal-600 font-medium transition-colors" id="general" data-category="general">
                <i class="fa-solid fa-language text-lg w-5 text-center"></i>
                <span class="hidden lg:block">General</span>
            </button>
            <button class="nav-btn flex items-center gap-3 px-3 py-3 rounded-xl text-ink-500 hover:bg-white hover:text-ink-900 transition-colors" id="mathematics" data-category="mathematics">
                <i class="fa-solid fa-square-root-variable text-lg w-5 text-center"></i>
                <span class="hidden lg:block">Mathematics</span>
            </button>
            <button class="nav-btn flex items-center gap-3 px-3 py-3 rounded-xl text-ink-500 hover:bg-white hover:text-ink-900 transition-colors" id="code" data-category="code">
                <i class="fa-solid fa-code text-lg w-5 text-center"></i>
                <span class="hidden lg:block">Code Assistants</span>
            </button>
            <button class="nav-btn flex items-center gap-3 px-3 py-3 rounded-xl text-ink-500 hover:bg-white hover:text-ink-900 transition-colors" id="instruction-following" data-category="instruction-following">
                <i class="fa-solid fa-list-check text-lg w-5 text-center"></i>
                <span class="hidden lg:block">Instruction Following</span>
            </button>
            <button class="nav-btn flex items-center gap-3 px-3 py-3 rounded-xl text-ink-500 hover:bg-white hover:text-ink-900 transition-colors" id="multi-tasking" data-category="multi-tasking">
                <i class="fa-solid fa-layer-group text-lg w-5 text-center"></i>
                <span class="hidden lg:block">Multi-tasking</span>
            </button>
            <button class="nav-btn flex items-center gap-3 px-3 py-3 rounded-xl text-ink-500 hover:bg-white hover:text-ink-900 transition-colors" id="long-context" data-category="long-context">
                <i class="fa-solid fa-book-open text-lg w-5 text-center"></i>
                <span class="hidden lg:block">Long Context</span>
            </button>
            <button class="nav-btn flex items-center gap-3 px-3 py-3 rounded-xl text-ink-500 hover:bg-white hover:text-ink-900 transition-colors" id="chat" data-category="chat">
                <i class="fa-solid fa-comments text-lg w-5 text-center"></i>
                <span class="hidden lg:block">Chat with us</span>
            </button>
        </div>

        <div class="p-4 border-t border-cream-200">
            <button id="auth-btn" class="w-full flex items-center justify-center lg:justify-start gap-3 px-3 py-3 rounded-xl text-ink-500 hover:bg-white hover:text-ink-900 transition-colors">
                <i class="fa-solid fa-right-to-bracket text-lg w-5 text-center"></i>
                <span class="hidden lg:block" id="auth-btn-label">Log in</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden relative bg-cream-50">

        <!-- Header -->
        <header class="h-16 glass flex items-center justify-between px-4 lg:px-8 z-10 sticky top-0">
            <div class="flex items-center bg-white rounded-full border border-cream-200 px-4 py-2 w-full max-w-md hidden sm:flex">
                <i class="fa-solid fa-search text-ink-400"></i>
                <input type="text" placeholder="Search models, providers..." class="bg-transparent border-none outline-none ml-3 text-sm text-ink-900 w-full placeholder-ink-400">
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main class="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth" id="main-content">
            <!-- Content gets injected here by JS -->
        </main>
    </div>

    <!-- Link to external JavaScript -->
    <script type="module" src="script.js"></script>
</body>
</html>
